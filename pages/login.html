<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <title>Login - Aarvi Stores</title>
  
  <style>
    :root {
      --bg-color: #ffffff;
      --surface-color: #ffffff;
      --text-main: #000000;
      --text-sub: #666666;
      --border: #e0e0e0;
      --input-bg: #f1f3f6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --surface-color: #1e1e1e;
        --text-main: #ffffff;
        --text-sub: #a0a0a0;
        --border: #333333;
        --input-bg: #2a2a2a;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    body, html {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .view-container {
      width: 100%;
      height: 100%;
      padding: 48px 24px 24px 24px;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.3s ease forwards;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
    p.subtitle { font-size: 15px; color: var(--text-sub); line-height: 1.5; padding: 0 10px; margin-bottom: 32px; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn:active { transform: scale(0.98); }

    .btn-google {
      background-color: var(--surface-color);
      color: var(--text-main);
      border: 1px solid var(--border);
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .btn-google:active { background-color: var(--input-bg); }

    .error-text { color: #d32f2f; font-size: 14px; margin-top: 12px; display: none; text-align: center; }
    
    .loader {
      display: none;
      width: 20px;
      height: 20px;
      border: 2.5px solid transparent;
      border-radius: 50%;
      border-top-color: currentColor;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <div class="view-container" id="login-container">
    
    <!-- Centered Branding Content -->
    <div style="margin-top: 15vh; display: flex; flex-direction: column; align-items: center; text-align: center;">
      <img src="../images/icon.png" alt="Aarvi Stores Logo" style="width: 80px; height: 80px; border-radius: 20px; box-shadow: 0 10px 24px rgba(0,0,0,0.12); margin-bottom: 24px;">
      <h1>Aarvi Stores</h1>
      <p class="subtitle">Sign in to experience fast checkout and track your orders seamlessly.</p>
    </div>

    <!-- Pinned Button at 75vh Thumb Zone -->
    <div style="position: absolute; top: 75vh; left: 24px; right: 24px;">
      <button class="btn btn-google" id="google-login-btn">
        <svg viewBox="0 0 48 48" width="24" height="24" id="google-icon">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="btn-text">Continue with Google</span>
        <div class="loader" id="btn-loader"></div>
      </button>
      <p class="error-text" id="error-msg"></p>
    </div>
  </div>

  <script type="module">
    import { auth, googleProvider } from '../config.js';
    import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const loginBtn = document.getElementById('google-login-btn');
    const btnText = document.getElementById('btn-text');
    const btnLoader = document.getElementById('btn-loader');
    const googleIcon = document.getElementById('google-icon');
    const errorMsg = document.getElementById('error-msg');

    // 1. Auth Listener - Triggers the redirect once Firebase confirms the session
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.replace("home.html");
      }
    });

    // 2. Google Login Trigger
    loginBtn.addEventListener('click', async () => {
      if (navigator.vibrate) navigator.vibrate(40);
      
      // UI Loading State
      loginBtn.style.pointerEvents = 'none';
      btnText.innerText = "Signing in...";
      googleIcon.style.display = 'none';
      btnLoader.style.display = 'block';
      errorMsg.style.display = 'none';

      try {
        await signInWithPopup(auth, googleProvider);
        // Success logic is intentionally empty here; onAuthStateChanged handles the redirect automatically
      } catch (error) {
        // Revert UI on failure
        loginBtn.style.pointerEvents = 'auto';
        btnText.innerText = "Continue with Google";
        googleIcon.style.display = 'block';
        btnLoader.style.display = 'none';
        errorMsg.innerText = error.message.includes('popup-closed') 
          ? "Login cancelled." 
          : "Failed to sign in.";
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
