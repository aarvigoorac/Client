<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Account - Aarvi Stores</title>
  
  <style>
    :root {
      --bg-color: #ffffff;
      --surface-color: #ffffff;
      --text-main: #000000;
      --text-sub: #666666;
      --border: #e0e0e0;
      --primary: #2874f0;
      --primary-hover: #1e5bb8;
      --input-bg: #f1f3f6;
      --success-bg: #e6f4ea;
      --success-text: #137333;
      --skeleton-base: #e0e0e0;
      --skeleton-shine: #f5f5f5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --surface-color: #1e1e1e;
        --text-main: #ffffff;
        --text-sub: #a0a0a0;
        --border: #333333;
        --input-bg: #2a2a2a;
        --success-bg: #1e3a29;
        --success-text: #81c995;
        --skeleton-base: #333333;
        --skeleton-shine: #444444;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    input {
      -webkit-touch-callout: default;
      user-select: auto;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      overflow-y: auto;
    }

    .view-container {
      width: 100%;
      padding: 24px 24px 100px 24px; /* Extra bottom padding for mobile nav */
      max-width: 600px;
      margin: 0 auto;
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Skeleton Loader Styles --- */
    .skeleton {
      background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-shine) 50%, var(--skeleton-base) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .sk-header { display: flex; align-items: center; gap: 20px; margin-bottom: 32px; padding: 20px; border-radius: 16px; background: var(--input-bg); }
    .sk-avatar { width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; }
    .sk-title { width: 150px; height: 20px; margin-bottom: 8px; }
    .sk-subtitle { width: 100px; height: 14px; }
    .sk-input { width: 100%; height: 56px; margin-bottom: 20px; border-radius: 10px; }
    .sk-btn { width: 100%; height: 50px; border-radius: 12px; margin-top: 24px; }
    .sk-row { display: flex; gap: 16px; }

    /* --- Form Styles --- */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
      background: var(--input-bg);
      padding: 20px;
      border-radius: 16px;
    }

    .profile-dp {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: var(--surface-color);
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .user-email { color: var(--text-sub); font-size: 14px; margin-top: 4px; }
    .section-title { font-size: 18px; margin: 16px 0 20px; font-weight: 700; color: var(--text-main); }

    .form-group { position: relative; margin-bottom: 20px; }
    .row { display: flex; gap: 16px; }
    .row .form-group { flex: 1; }

    .form-input {
      width: 100%;
      padding: 20px 16px 8px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--surface-color);
      color: var(--text-main);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus { border-color: var(--primary); }

    .form-label {
      position: absolute;
      left: 16px;
      top: 16px;
      font-size: 16px;
      color: var(--text-sub);
      transition: 0.2s ease all;
      pointer-events: none;
    }

    .form-input:focus ~ .form-label,
    .form-input:not(:placeholder-shown) ~ .form-label {
      top: 6px;
      font-size: 12px;
      color: var(--primary);
    }
    .form-input:not(:focus):not(:placeholder-shown) ~ .form-label {
      color: var(--text-sub);
    }

    /* --- Buttons & Utilities --- */
    .btn {
      display: flex; align-items: center; justify-content: center; width: 100%;
      padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    
    .btn-primary { background-color: var(--primary); color: #fff; margin-top: 12px; box-shadow: 0 4px 12px rgba(40, 116, 240, 0.2); }
    .btn-primary:active { background-color: var(--primary-hover); }
    
    .btn-outline { background-color: transparent; color: var(--primary); border: 2px solid var(--primary); padding: 14px; border-radius: 10px; gap: 8px; margin-bottom: 20px; }
    .btn-outline:active { background-color: rgba(40, 116, 240, 0.1); }
    
    .btn-danger { background-color: transparent; color: #d32f2f; margin-top: 24px; font-size: 15px; }

    .gps-result-card { display: flex; align-items: center; justify-content: space-between; background-color: var(--success-bg); border: 1px solid var(--success-text); padding: 16px; border-radius: 10px; margin-bottom: 20px; }
    .coords-text { color: var(--success-text); font-size: 14px; font-weight: 600; margin-top: 4px; }
    .retake-btn { background: none; border: none; color: var(--text-main); font-weight: 600; font-size: 14px; cursor: pointer; padding: 8px; text-decoration: underline; }

    .hidden { display: none !important; }
    .error-text { color: #d32f2f; font-size: 14px; margin-top: 8px; display: none; text-align: center; }

    .loader {
      display: none; width: 20px; height: 20px; border: 2.5px solid transparent;
      border-radius: 50%; border-top-color: currentColor; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast Notification */
    #toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--text-main); color: var(--bg-color); padding: 12px 24px;
      border-radius: 50px; font-size: 14px; font-weight: 600; opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000;
      display: flex; align-items: center; gap: 8px;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div class="view-container">
    
    <!-- 1. Skeleton Loading View -->
    <div id="skeleton-view">
      <div class="sk-header">
        <div class="skeleton sk-avatar"></div>
        <div>
          <div class="skeleton sk-title"></div>
          <div class="skeleton sk-subtitle"></div>
        </div>
      </div>
      <div class="skeleton sk-title" style="margin: 16px 0 20px;"></div>
      <div class="skeleton sk-input"></div>
      <div class="skeleton sk-input"></div>
      <div class="skeleton sk-title" style="margin: 16px 0 20px;"></div>
      <div class="skeleton sk-input" style="height: 48px;"></div> <!-- GPS Button -->
      <div class="skeleton sk-input"></div>
      <div class="skeleton sk-input"></div>
      <div class="sk-row">
        <div class="skeleton sk-input"></div>
        <div class="skeleton sk-input"></div>
      </div>
      <div class="skeleton sk-input"></div>
      <div class="skeleton sk-btn"></div>
    </div>

    <!-- 2. Active Form View -->
    <div id="form-view" class="hidden">
      
      <div class="profile-header">
        <img id="user-dp" class="profile-dp" src="" alt="Profile">
        <div>
          <h2 style="font-size: 20px; font-weight: 700;">My Account</h2>
          <p class="user-email" id="user-email"></p>
        </div>
      </div>

      <h3 class="section-title">Personal Details</h3>
      
      <div class="form-group">
        <input type="text" id="f-name" class="form-input" placeholder=" ">
        <label class="form-label">Full Name</label>
      </div>

      <div class="form-group">
        <input type="tel" id="f-phone" class="form-input" placeholder=" ">
        <label class="form-label">Mobile Number</label>
      </div>

      <h3 class="section-title">Delivery Address</h3>
      
      <!-- GPS Integration -->
      <button type="button" class="btn btn-outline" id="gps-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span id="gps-btn-text">Update Location</span>
        <div class="loader" id="gps-loader" style="border-top-color: var(--primary);"></div>
      </button>

      <div id="gps-result" class="gps-result-card hidden">
        <div style="display: flex; gap: 12px; align-items: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--success-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          <div>
            <div style="font-size: 12px; color: var(--success-text); opacity: 0.8;">Location Captured</div>
            <div class="coords-text" id="coords-display"></div>
          </div>
        </div>
        <button type="button" class="retake-btn" id="retry-gps">Retake</button>
      </div>

      <!-- Manual Address Fields -->
      <div class="form-group">
        <input type="text" id="f-house" class="form-input" placeholder=" ">
        <label class="form-label">House No., Building Name</label>
      </div>

      <div class="form-group">
        <input type="text" id="f-area" class="form-input" placeholder=" ">
        <label class="form-label">Road Name, Area, Colony</label>
      </div>

      <div class="row">
        <div class="form-group">
          <input type="text" id="f-pincode" class="form-input" placeholder=" " inputmode="numeric" maxlength="6">
          <label class="form-label">Pincode</label>
        </div>
        <div class="form-group">
          <input type="text" id="f-city" class="form-input" placeholder=" ">
          <label class="form-label">City</label>
        </div>
      </div>

      <div class="form-group">
        <input type="text" id="f-state" class="form-input" placeholder=" ">
        <label class="form-label">State</label>
      </div>

      <p class="error-text" id="save-error-msg"></p>

      <button class="btn btn-primary" id="save-btn">
        <span id="save-text">Save Changes</span>
        <div class="loader" id="save-loader" style="border-top-color: #fff;"></div>
      </button>

      <!-- Logout Button -->
      <button class="btn btn-danger" id="logout-btn">Log Out</button>

    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
    Profile Updated
  </div>

  <script type="module">
    import { auth, db } from '../config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // UI Elements
    const skeletonView = document.getElementById('skeleton-view');
    const formView = document.getElementById('form-view');
    const toast = document.getElementById('toast');
    
    // Inputs
    const fName = document.getElementById('f-name');
    const fPhone = document.getElementById('f-phone');
    const fHouse = document.getElementById('f-house');
    const fArea = document.getElementById('f-area');
    const fPincode = document.getElementById('f-pincode');
    const fCity = document.getElementById('f-city');
    const fState = document.getElementById('f-state');
    
    // GPS UI
    const gpsBtn = document.getElementById('gps-btn');
    const gpsBtnText = document.getElementById('gps-btn-text');
    const gpsLoader = document.getElementById('gps-loader');
    const gpsResult = document.getElementById('gps-result');
    const coordsDisplay = document.getElementById('coords-display');
    const retryGps = document.getElementById('retry-gps');
    
    // Save UI
    const saveBtn = document.getElementById('save-btn');
    const saveError = document.getElementById('save-error-msg');
    
    let currentUser = null;
    let userCoordinates = null;

    // 1. Fetch Data on Load
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        
        try {
          const userRef = doc(db, 'users', user.uid);
          const userSnap = await getDoc(userRef);

          if (userSnap.exists()) {
            const data = userSnap.data();
            
            // Populate basic info
            document.getElementById('user-dp').src = data.photoURL || '';
            document.getElementById('user-email').innerText = data.email || '';
            
            // Populate form fields
            fName.value = data.name || '';
            fPhone.value = data.phone || '';
            
            if (data.address_details) {
              fHouse.value = data.address_details.house || '';
              fArea.value = data.address_details.area || '';
              fPincode.value = data.address_details.pincode || '';
              fCity.value = data.address_details.city || '';
              fState.value = data.address_details.state || '';
            }

            // Populate existing GPS if available
            if (data.coordinates) {
              userCoordinates = data.coordinates;
              gpsBtn.classList.add('hidden');
              gpsResult.classList.remove('hidden');
              coordsDisplay.innerText = `${userCoordinates.latitude.toFixed(5)}, ${userCoordinates.longitude.toFixed(5)}`;
            }

            // Swap Views
            skeletonView.classList.add('hidden');
            formView.classList.remove('hidden');
          }
        } catch (error) {
          console.error("Error fetching user data:", error);
        }
      }
    });

    // 2. GPS Logic
    gpsBtn.addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate(40);
      if (!navigator.geolocation) return alert("Geolocation not supported.");

      gpsBtn.style.pointerEvents = 'none';
      gpsBtnText.innerText = "Fetching...";
      gpsBtn.querySelector('svg').style.display = 'none';
      gpsLoader.style.display = 'block';

      navigator.geolocation.getCurrentPosition(
        (position) => {
          userCoordinates = { latitude: position.coords.latitude, longitude: position.coords.longitude, accuracy: position.coords.accuracy };
          gpsBtn.classList.add('hidden');
          gpsResult.classList.remove('hidden');
          coordsDisplay.innerText = `${userCoordinates.latitude.toFixed(5)}, ${userCoordinates.longitude.toFixed(5)}`;
          
          gpsBtn.style.pointerEvents = 'auto';
          gpsBtnText.innerText = "Update Location";
          gpsBtn.querySelector('svg').style.display = 'block';
          gpsLoader.style.display = 'none';
        },
        (error) => {
          alert("Unable to fetch location. Check permissions.");
          gpsBtn.style.pointerEvents = 'auto';
          gpsBtnText.innerText = "Update Location";
          gpsBtn.querySelector('svg').style.display = 'block';
          gpsLoader.style.display = 'none';
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });

    retryGps.addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate(40);
      userCoordinates = null;
      gpsResult.classList.add('hidden');
      gpsBtn.classList.remove('hidden');
    });

    // 3. Save Logic
    saveBtn.addEventListener('click', async () => {
      if (navigator.vibrate) navigator.vibrate(40);
      saveError.style.display = 'none';

      const name = fName.value.trim();
      const phone = fPhone.value.trim();
      const house = fHouse.value.trim();
      const area = fArea.value.trim();
      const pincode = fPincode.value.trim();
      const city = fCity.value.trim();
      const state = fState.value.trim();

      if (!name || phone.length < 5 || !house || !area || !pincode || !city || !state) {
        saveError.innerText = "Please fill out all fields.";
        saveError.style.display = 'block';
        return;
      }

      const fullAddress = `${house}, ${area}, ${city}, ${state} - ${pincode}`;

      saveBtn.style.pointerEvents = 'none';
      document.getElementById('save-text').style.display = 'none';
      document.getElementById('save-loader').style.display = 'block';

      try {
        await updateDoc(doc(db, 'users', currentUser.uid), {
          name: name,
          phone: phone,
          address: fullAddress, 
          address_details: { house, area, city, state, pincode },
          coordinates: userCoordinates,
          updatedAt: new Date().toISOString()
        });

        // Show Toast
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);

      } catch (error) {
        saveError.innerText = "Failed to update profile. Try again.";
        saveError.style.display = 'block';
      } finally {
        saveBtn.style.pointerEvents = 'auto';
        document.getElementById('save-text').style.display = 'block';
        document.getElementById('save-loader').style.display = 'none';
      }
    });

    // 4. Logout Logic
    document.getElementById('logout-btn').addEventListener('click', async () => {
      if (navigator.vibrate) navigator.vibrate(40);
      if (confirm("Are you sure you want to log out?")) {
        await signOut(auth);
        window.top.location.replace("pages/login.html");
      }
    });
  </script>
</body>
</html>
