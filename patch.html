<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Database Patch - Aarvi Stores</title>
  <style>
    :root {
      --bg-color: #f1f3f6;
      --surface-color: #ffffff;
      --text-main: #000000;
      --text-sub: #666666;
      --border: #e0e0e0;
      --primary: #2874f0;
      --danger: #d32f2f;
      --danger-bg: #ffebee;
      --success: #2e7d32;
      --success-bg: #e8f5e9;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --surface-color: #1e1e1e;
        --text-main: #ffffff;
        --text-sub: #a0a0a0;
        --border: #333333;
        --danger: #f2b8b5;
        --danger-bg: #410e0b;
        --success: #81c995;
        --success-bg: #1e3a29;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .card { background: var(--surface-color); padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 500px; border: 1px solid var(--border); }
    .card-header { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .card-desc { font-size: 14px; color: var(--text-sub); margin-bottom: 24px; line-height: 1.5; }

    .warning-box { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger); padding: 12px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 24px; display: flex; align-items: flex-start; gap: 8px; }
    .warning-box svg { width: 18px; height: 18px; flex-shrink: 0; }

    .btn-start { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.1s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-start:active { transform: scale(0.97); }
    .btn-start:disabled { opacity: 0.7; pointer-events: none; }

    .log-container { margin-top: 24px; background: #000; color: #0f0; font-family: monospace; padding: 16px; border-radius: 8px; font-size: 12px; height: 250px; overflow-y: auto; display: none; }
    .log-container.active { display: block; }
    .log-entry { margin-bottom: 4px; }
    .log-success { color: #4af54a; }
    .log-error { color: #ff5555; }
    .log-warn { color: #ffeb3b; }

    .spinner { animation: spin 1s linear infinite; width: 18px; height: 18px; stroke: currentColor; display: none; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">Inventory Patcher</div>
    <div class="card-desc">This utility will completely wipe the existing <code>products</code> collection and seed it with 50 procedurally generated dummy items for UI testing.</div>
    
    <div class="warning-box">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
      <div>Warning: This action is irreversible. All real products in the database will be permanently deleted.</div>
    </div>

    <button class="btn-start" id="btn-start">
      <span id="btn-text">Start Database Patch</span>
      <svg class="spinner" id="spinner" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle><path d="M12 2v4"></path></svg>
    </button>

    <div class="log-container" id="log-container"></div>
  </div>

  <script type="module">
    import { auth, db } from './config.js';
    import { collection, getDocs, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const btnStart = document.getElementById('btn-start');
    const btnText = document.getElementById('btn-text');
    const spinner = document.getElementById('spinner');
    const logContainer = document.getElementById('log-container');

    let currentUser = null;

    // Wait for auth to ensure they have write permissions
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
      } else {
        logMsg("WARNING: You are not logged in. Database rules may reject this patch.", "warn");
      }
    });

    function logMsg(msg, type = 'normal') {
      logContainer.classList.add('active');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type !== 'normal' ? 'log-' + type : ''}`;
      entry.innerText = `> ${msg}`;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // Helper: Generate Firestore compatible search keyword prefixes
    // E.g. "Red Shirt" -> [r, re, red, s, sh, shi, shir, shirt, red shirt]
    function generateSearchKeywords(productName) {
      const keywords = [];
      const words = productName.toLowerCase().split(' ');
      
      // Add prefix array for each individual word
      words.forEach(word => {
        let currentString = '';
        for (let i = 0; i < word.length; i++) {
          currentString += word[i];
          keywords.push(currentString);
        }
      });
      
      // Add the exact full phrase
      keywords.push(productName.toLowerCase());
      
      // Return unique array
      return [...new Set(keywords)];
    }

    // Helper: Procedural Data Generators
    const adjectives = ["Premium", "Ultra", "Essential", "Classic", "Modern", "Smart", "Luxury", "Compact", "Pro", "Vintage"];
    const nouns = ["Wireless Earbuds", "Cotton T-Shirt", "Coffee Mug", "Running Shoes", "Backpack", "Desk Lamp", "Mechanical Keyboard", "Yoga Mat", "Sunglasses", "Gaming Mouse"];
    const descs = [
      "Experience unparalleled comfort and style. Designed for everyday use with high-quality materials.",
      "The perfect addition to your daily routine. Lightweight, durable, and highly efficient.",
      "Engineered for maximum performance. Stand out from the crowd with this exceptional product.",
      "Minimalist design meets maximum functionality. Built to last through rigorous daily wear and tear."
    ];

    function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    btnStart.addEventListener('click', async () => {
      btnStart.disabled = true;
      btnText.innerText = "Patching...";
      spinner.style.display = 'block';
      logContainer.innerHTML = '';

      try {
        logMsg("Initializing database patch sequence...");

        // ---------------------------------------------------------
        // PHASE 1: WIPE EXISTING INVENTORY
        // ---------------------------------------------------------
        logMsg("Fetching existing products for deletion...");
        const productsRef = collection(db, 'products');
        const snapshot = await getDocs(productsRef);
        
        if (snapshot.empty) {
          logMsg("Inventory is already empty. Skipping deletion.", "warn");
        } else {
          logMsg(`Found ${snapshot.size} items. Deleting...`);
          const deletePromises = [];
          snapshot.forEach((d) => {
            deletePromises.push(deleteDoc(doc(db, 'products', d.id)));
          });
          
          await Promise.all(deletePromises);
          logMsg(`Successfully deleted ${snapshot.size} old items.`, "success");
        }

        // ---------------------------------------------------------
        // PHASE 2: GENERATE NEW INVENTORY
        // ---------------------------------------------------------
        logMsg("Generating 50 new dummy products...");
        const createPromises = [];

        for (let i = 1; i <= 50; i++) {
          const adj = getRandomItem(adjectives);
          const noun = getRandomItem(nouns);
          const fullName = `${adj} ${noun}`;
          
          const ratingCount = getRandomInt(0, 500);
          // Generate a realistic sum based on a 3.5 to 4.9 average
          const avgRating = (Math.random() * (4.9 - 3.5) + 3.5);
          const ratingSum = ratingCount > 0 ? (ratingCount * avgRating) : 0;

          const productData = {
            name: fullName,
            price: getRandomInt(299, 4999),
            description: getRandomItem(descs),
            images: {
              // Using Picsum seed to ensure the image stays consistent for the same item ID
              thumbnail: `https://picsum.photos/seed/aarvi${i}/400/400`
            },
            ratingCount: ratingCount,
            ratingSum: ratingSum,
            searchKeywords: generateSearchKeywords(fullName),
            createdAt: new Date().toISOString()
          };

          // Generate a clean doc ID like "PROD-001"
          const docId = `PROD-${i.toString().padStart(3, '0')}`;
          
          createPromises.push(setDoc(doc(db, 'products', docId), productData));
          
          if (i % 10 === 0) {
            logMsg(`Queued ${i}/50 products...`);
          }
        }

        logMsg("Writing all 50 products to Firestore...");
        await Promise.all(createPromises);

        logMsg("Database Patch Complete!", "success");
        btnStart.style.background = "var(--success)";
        btnText.innerText = "Patch Complete";

      } catch (error) {
        console.error(error);
        logMsg(`CRITICAL ERROR: ${error.message}`, "error");
        btnStart.style.background = "var(--danger)";
        btnText.innerText = "Patch Failed";
      } finally {
        spinner.style.display = 'none';
        btnStart.disabled = false;
      }
    });
  </script>
</body>
</html>
